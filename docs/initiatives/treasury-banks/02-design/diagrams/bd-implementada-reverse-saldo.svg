<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 640" width="1390" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34506b"/></marker></defs>
<rect width="1390" height="640" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="700" fill="#1b2733">Cómo se deshace un movimiento y cómo se calcula el saldo</text><text x="40" y="54" font-size="12.5" fill="#5b6b7a">Ejemplo real de la prueba funcional de las migraciones 0035–0038 (COP y USD en la misma cuenta)</text>
<rect x="40" y="90" width="330" height="110" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="205.0" y="112" font-size="13" font-weight="700" fill="#1b2733" text-anchor="middle">Movimiento A (create)</text><text x="205.0" y="132" font-size="12" fill="#5b6b7a" text-anchor="middle">bank_transactions · operation = create</text><text x="205.0" y="149" font-size="12" fill="#5b6b7a" text-anchor="middle">idempotency_key = k1</text><text x="205.0" y="166" font-size="12" fill="#5b6b7a" text-anchor="middle">Detalle: +100 COP · in</text><text x="205.0" y="183" font-size="12" fill="#5b6b7a" text-anchor="middle">Detalle: +5 USD · in</text><rect x="530" y="90" width="330" height="110" rx="8" fill="#fff6e8" stroke="#b45309" stroke-width="1.5"/><text x="695.0" y="112" font-size="13" font-weight="700" fill="#1b2733" text-anchor="middle">Movimiento B (reverse)</text><text x="695.0" y="132" font-size="12" fill="#5b6b7a" text-anchor="middle">bank_transactions · operation = reverse</text><text x="695.0" y="149" font-size="12" fill="#5b6b7a" text-anchor="middle">idempotency_key = k2</text><text x="695.0" y="166" font-size="12" fill="#5b6b7a" text-anchor="middle">Detalle: 100 COP · out</text><text x="695.0" y="183" font-size="12" fill="#5b6b7a" text-anchor="middle">reverses_detail_id → detalle de 100 COP</text><line x1="370" y1="145" x2="530" y2="145" stroke="#34506b" stroke-width="1.8" marker-end="url(#a)"/><text x="450" y="137" fill="#34506b" font-size="11" text-anchor="middle" font-weight="600">deshace</text><rect x="1020" y="90" width="330" height="110" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="1185.0" y="112" font-size="13" font-weight="700" fill="#1b2733" text-anchor="middle">bank_audit</text><text x="1185.0" y="132" font-size="12" fill="#5b6b7a" text-anchor="middle">Una fila por cada operación</text><text x="1185.0" y="149" font-size="12" fill="#5b6b7a" text-anchor="middle">append-only: sin UPDATE ni DELETE</text><text x="1185.0" y="166" font-size="12" fill="#5b6b7a" text-anchor="middle">actor_user_id + payload JSON</text><line x1="860" y1="145" x2="1020" y2="145" stroke="#34506b" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="940" y="137" fill="#34506b" font-size="11" text-anchor="middle" font-weight="600">registra</text><text x="40" y="270" font-size="13" font-weight="700" fill="#1b2733">Saldo tras registrar solo A</text><rect x="40" y="280" width="400" height="26" fill="#1f4e79" stroke="#b8c4d0"/><text x="54" y="297" font-size="12" fill="#fff" font-weight="700">moneda</text><text x="149" y="297" font-size="12" fill="#fff" font-weight="700">total_in</text><text x="244" y="297" font-size="12" fill="#fff" font-weight="700">total_out</text><text x="339" y="297" font-size="12" fill="#fff" font-weight="700">balance</text><rect x="40" y="306" width="400" height="26" fill="#eaf0f6" stroke="#b8c4d0"/><text x="54" y="323" font-size="12" fill="#1b2733" font-weight="400">COP</text><text x="149" y="323" font-size="12" fill="#1b2733" font-weight="400">100</text><text x="244" y="323" font-size="12" fill="#1b2733" font-weight="400">0</text><text x="339" y="323" font-size="12" fill="#1b2733" font-weight="400">100</text><rect x="40" y="332" width="400" height="26" fill="#f5f8fb" stroke="#b8c4d0"/><text x="54" y="349" font-size="12" fill="#1b2733" font-weight="400">USD</text><text x="149" y="349" font-size="12" fill="#1b2733" font-weight="400">5</text><text x="244" y="349" font-size="12" fill="#1b2733" font-weight="400">0</text><text x="339" y="349" font-size="12" fill="#1b2733" font-weight="400">5</text><text x="530" y="270" font-size="13" font-weight="700" fill="#1b2733">Saldo tras registrar A y B</text><rect x="530" y="280" width="400" height="26" fill="#1f4e79" stroke="#b8c4d0"/><text x="544" y="297" font-size="12" fill="#fff" font-weight="700">moneda</text><text x="639" y="297" font-size="12" fill="#fff" font-weight="700">total_in</text><text x="734" y="297" font-size="12" fill="#fff" font-weight="700">total_out</text><text x="829" y="297" font-size="12" fill="#fff" font-weight="700">balance</text><rect x="530" y="306" width="400" height="26" fill="#eaf0f6" stroke="#b8c4d0"/><text x="544" y="323" font-size="12" fill="#1b2733" font-weight="400">COP</text><text x="639" y="323" font-size="12" fill="#1b2733" font-weight="400">100</text><text x="734" y="323" font-size="12" fill="#1b2733" font-weight="400">100</text><text x="829" y="323" font-size="12" fill="#1b2733" font-weight="400">0</text><rect x="530" y="332" width="400" height="26" fill="#f5f8fb" stroke="#b8c4d0"/><text x="544" y="349" font-size="12" fill="#1b2733" font-weight="400">USD</text><text x="639" y="349" font-size="12" fill="#1b2733" font-weight="400">5</text><text x="734" y="349" font-size="12" fill="#1b2733" font-weight="400">0</text><text x="829" y="349" font-size="12" fill="#1b2733" font-weight="400">5</text><line x1="452" y1="330" x2="518" y2="330" stroke="#34506b" stroke-width="1.8" marker-end="url(#a)"/><text x="485" y="320" fill="#34506b" font-size="11" text-anchor="middle" font-weight="600">+ B</text><text x="40" y="410" font-size="13" font-weight="700" fill="#1b2733">Cómo se calcula (vista bank_account_balances)</text><text x="40" y="432" font-size="12.5" fill="#5b6b7a">balance = Σ(amount de detalles in) − Σ(amount de detalles out), agrupado por cuenta bancaria y moneda. Es una consulta: no hay trigger ni tabla de saldo que pueda desincronizarse.</text><rect x="40" y="460" width="1310" height="150" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="56" y="486" font-size="13" font-weight="700" fill="#1b2733">Reglas que la base de datos hace cumplir (probadas el 2026-10-27 en una transacción descartada)</text><text x="56" y="512" font-size="12.5" fill="#1b2733">• Un detalle solo puede revertirse una vez (índice único sobre reverses_detail_id).</text><text x="56" y="532" font-size="12.5" fill="#1b2733">• El reverse debe tener misma moneda y monto y dirección opuesta al detalle original; solo un movimiento reverse puede llevar reverses_detail_id.</text><text x="56" y="552" font-size="12.5" fill="#1b2733">• Movimientos, detalles y auditoría no admiten UPDATE ni DELETE: corregir = reverse + create.</text><text x="56" y="572" font-size="12.5" fill="#1b2733">• La misma idempotency_key no puede registrarse dos veces en la empresa (evita doble posteo).</text><text x="56" y="592" font-size="12.5" fill="#1b2733">• Cuenta contable e institución privada deben pertenecer a la misma empresa; todas las FK compuestas incluyen company_id.</text></svg>