<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 950" width="1340" height="950" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34506b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a33a3a"/></marker></defs>
<rect width="1340" height="950" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="700" fill="#1b2733">registerMovement — qué ocurre, en orden (create y reverse)</text>
<text x="40" y="54" font-size="12.5" fill="#5b6b7a">¿Qué valida y qué escribe el backend al registrar un movimiento, y qué errores devuelve?</text>
<rect x="10" y="76" width="160" height="34" rx="6" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="90" y="98" font-size="12.5" fill="#1b2733" font-weight="700" text-anchor="middle">Cliente</text><line x1="90" y1="110" x2="90" y2="930" stroke="#9fb0bf" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="250" y="76" width="160" height="34" rx="6" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="330" y="98" font-size="12.5" fill="#1b2733" font-weight="700" text-anchor="middle">Router + middleware</text><line x1="330" y1="110" x2="330" y2="930" stroke="#9fb0bf" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="510" y="76" width="160" height="34" rx="6" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="590" y="98" font-size="12.5" fill="#1b2733" font-weight="700" text-anchor="middle">banksController</text><line x1="590" y1="110" x2="590" y2="930" stroke="#9fb0bf" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="770" y="76" width="160" height="34" rx="6" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="850" y="98" font-size="12.5" fill="#1b2733" font-weight="700" text-anchor="middle">ingestMovement</text><line x1="850" y1="110" x2="850" y2="930" stroke="#9fb0bf" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="1130" y="76" width="160" height="34" rx="6" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="1210" y="98" font-size="12.5" fill="#1b2733" font-weight="700" text-anchor="middle">BD Treasury / Ecosystem</text><line x1="1210" y1="110" x2="1210" y2="930" stroke="#9fb0bf" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="90" y1="140" x2="328" y2="140" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="210.0" y="134" font-size="11" fill="#34506b" text-anchor="middle">POST /treasury/banks/registerMovement (UMJP)</text><line x1="330" y1="170" x2="588" y2="170" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="460.0" y="164" font-size="11" fill="#34506b" text-anchor="middle">sesión válida + compañía activa</text><line x1="330" y1="196" x2="92" y2="196" stroke="#a33a3a" stroke-width="1.6" marker-end="url(#r)" stroke-dasharray="5 4"/><text x="210.0" y="190" font-size="11" fill="#a33a3a" text-anchor="middle">400 / 401 / 403 si falla sesión, origen o compañía</text><rect x="470" y="214" width="300" height="46" rx="6" fill="#fff7e0" stroke="#c9a227" stroke-width="1.2"/><text x="480" y="233" font-size="11" fill="#2b3a48" text-anchor="start">Body con company_id ≠ sesión → 403</text><text x="480" y="249" font-size="11" fill="#2b3a48" text-anchor="start">Se fija actor.user_id = usuario de sesión</text><line x1="590" y1="278" x2="848" y2="278" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="720.0" y="272" font-size="11" fill="#34506b" text-anchor="middle">withTransaction → BEGIN → ingestMovement</text><rect x="700" y="296" width="300" height="62" rx="6" fill="#fff7e0" stroke="#c9a227" stroke-width="1.2"/><text x="710" y="315" font-size="11" fill="#2b3a48" text-anchor="start">Normaliza: schema_version 1.0, operation,</text><text x="710" y="331" font-size="11" fill="#2b3a48" text-anchor="start">bank_account_id, idempotency_key, origin,</text><text x="710" y="347" font-size="11" fill="#2b3a48" text-anchor="start">actor, created_at UTC, details[]</text><line x1="850" y1="388" x2="1208" y2="388" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="1030.0" y="382" font-size="11" fill="#34506b" text-anchor="middle">¿existe idempotency_key (company_id)?</text><line x1="1210" y1="414" x2="592" y2="414" stroke="#2f6b46" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="900.0" y="408" font-size="11" fill="#2f6b46" text-anchor="middle">sí → 200 { idempotent_replay:true } sin duplicar</text><text x="864" y="438" font-size="11" fill="#5b6b7a" text-anchor="start">no existe → sigue</text><rect x="60" y="450" width="470" height="78" rx="6" fill="#eef6ff" stroke="#34506b" stroke-width="1.2"/><text x="70" y="469" font-size="11" fill="#2b3a48" text-anchor="start">operation = create:</text><text x="70" y="485" font-size="11" fill="#2b3a48" text-anchor="start">• cuenta activa de la empresa y moneda ∈ allowed_currencies (404 / 400)</text><text x="70" y="501" font-size="11" fill="#2b3a48" text-anchor="start">• documento existe y es de la empresa (400)</text><text x="70" y="517" font-size="11" fill="#2b3a48" text-anchor="start">• account_id de cada detalle ∈ contable_accounts de la empresa (400)</text><rect x="60" y="552" width="470" height="78" rx="6" fill="#eef6ff" stroke="#34506b" stroke-width="1.2"/><text x="70" y="571" font-size="11" fill="#2b3a48" text-anchor="start">operation = reverse:</text><text x="70" y="587" font-size="11" fill="#2b3a48" text-anchor="start">• carga los detalles originales FOR UPDATE (404 si no existen)</text><text x="70" y="603" font-size="11" fill="#2b3a48" text-anchor="start">• ya revertido → 409</text><text x="70" y="619" font-size="11" fill="#2b3a48" text-anchor="start">• misma moneda y monto; dirección opuesta; mismo concepto y cuenta</text><line x1="850" y1="690" x2="1208" y2="690" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="1030.0" y="684" font-size="11" fill="#34506b" text-anchor="middle">INSERT bank_transactions (ON CONFLICT DO NOTHING)</text><line x1="850" y1="716" x2="1208" y2="716" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="1030.0" y="710" font-size="11" fill="#34506b" text-anchor="middle">INSERT bank_transaction_details × n</text><line x1="850" y1="742" x2="1208" y2="742" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="1030.0" y="736" font-size="11" fill="#34506b" text-anchor="middle">INSERT bank_audit × n (registerMovementAudit)</text><line x1="850" y1="786" x2="592" y2="786" stroke="#2f6b46" stroke-width="1.6" marker-end="url(#a)"/><text x="720.0" y="780" font-size="11" fill="#2f6b46" text-anchor="middle">{ transaction_id, idempotent_replay:false, details[] }</text><line x1="590" y1="812" x2="1208" y2="812" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="900.0" y="806" font-size="11" fill="#34506b" text-anchor="middle">COMMIT</text><line x1="590" y1="838" x2="92" y2="838" stroke="#2f6b46" stroke-width="1.6" marker-end="url(#a)"/><text x="340.0" y="832" font-size="11" fill="#2f6b46" text-anchor="middle">200 { transaction_id, details:[{id, client_detail_id}] }</text><rect x="60" y="866" width="1180" height="62" rx="6" fill="#fdeeee" stroke="#a33a3a" stroke-width="1.2"/><text x="70" y="885" font-size="11" fill="#2b3a48" text-anchor="start">Cualquier error dentro de la transacción → ROLLBACK (no queda movimiento ni auditoría a medias) → statusCode del error ?? 500.</text><text x="70" y="901" font-size="11" fill="#2b3a48" text-anchor="start">Carrera por la misma idempotency_key: el INSERT no inserta, se vuelve a leer el existente y se devuelve como replay. Un detalle ya revertido choca con el índice único → 409.</text><text x="70" y="917" font-size="11" fill="#2b3a48" text-anchor="start">Reintentar con la misma idempotency_key es seguro: devuelve el mismo resultado.</text>
</svg>
