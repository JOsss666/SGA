<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 846" width="1200" height="846" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34506b"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a33a3a"/></marker></defs>
<rect width="1200" height="846" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="700" fill="#1b2733">Backend de Bancos implementado — capas y endpoints</text>
<text x="40" y="54" font-size="12.5" fill="#5b6b7a">¿Qué piezas existen hoy y cómo se conectan, de la petición HTTP a la base de datos?</text>
<rect x="40" y="80" width="1120" height="64" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="52" y="101" font-size="13" font-weight="700" fill="#1b2733">Consumidor (hoy: pruebas por API; sin UI de TBANKS verificada en Facturation/*/src)</text><text x="52" y="121" font-size="11.5" fill="#2b3a48">POST JSON con cookie de sesión + header X-SGA-Company-Id + origen confiable</text><line x1="600" y1="144" x2="600" y2="172" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="172" width="1120" height="92" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="52" y="193" font-size="13" font-weight="700" fill="#1b2733">Router — api/routes/index.routes.js</text><text x="52" y="213" font-size="11.5" fill="#2b3a48">banksRouteMiddlewares = requireTrustedOrigin → authenticateSession → requireCompanyAccess (deja req.auth.companyId / userId)</text><text x="52" y="229" font-size="11.5" fill="#2b3a48">10 rutas POST /treasury/banks/…  (sin express.json: el controlador lee el cuerpo crudo con readJsonBody)</text><text x="52" y="245" font-size="11.5" fill="#2b3a48">Fallo de sesión/compañía: 400 INVALID_COMPANY_CONTEXT · 403 COMPANY_ACCESS_DENIED (middleware)</text><line x1="600" y1="264" x2="600" y2="292" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="292" width="1120" height="108" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="52" y="313" font-size="13" font-weight="700" fill="#1b2733">banksController — api/controllers/banksController.js  (createHandler por endpoint)</text><text x="52" y="333" font-size="11.5" fill="#2b3a48">1) readJsonBody  2) exige req.auth.companyId (400)  3) si el body trae company_id distinto → 403; si no, lo fija al de la sesión</text><text x="52" y="349" font-size="11.5" fill="#2b3a48">4) registerMovement: inyecta actor.user_id = req.auth.userId   5) withTransaction(client → servicio)  (BEGIN/COMMIT/ROLLBACK)</text><text x="52" y="365" font-size="11.5" fill="#2b3a48">6) Éxito → 200 + JSON del servicio · Error → error.statusCode ?? 500 con { status:&#x27;Error&#x27;, message }</text><line x1="320" y1="400" x2="320" y2="436" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><line x1="880" y1="400" x2="880" y2="436" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="436" width="520" height="128" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="52" y="457" font-size="13" font-weight="700" fill="#1b2733">banksService.js — catálogo</text><text x="52" y="477" font-size="11.3" fill="#2b3a48">listInstitutions · createInstitution (siempre company_private)</text><text x="52" y="493" font-size="11.3" fill="#2b3a48">listBanks · createBank (sin cuenta contable)</text><text x="52" y="509" font-size="11.3" fill="#2b3a48">listAccounts · createAccount (valida monedas + herencia</text><text x="52" y="525" font-size="11.3" fill="#2b3a48">  institución ⊕ banco ⊕ cuenta; account_id ∈ contable_accounts)</text><text x="52" y="541" font-size="11.3" fill="#2b3a48">Errores de validación: new Error() → llegan como 500</text><rect x="600" y="436" width="560" height="128" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="612" y="457" font-size="13" font-weight="700" fill="#1b2733">banksMovementsService.js — movimientos y lecturas</text><text x="612" y="477" font-size="11.3" fill="#2b3a48">registerMovement → ingestMovement (create | reverse, idempotente)</text><text x="612" y="493" font-size="11.3" fill="#2b3a48">getAccountBalance → lee la vista bank_account_balances</text><text x="612" y="509" font-size="11.3" fill="#2b3a48">listMovements → filtra por instantes UTC (created_at ≥ inicio, &lt; fin)</text><text x="612" y="525" font-size="11.3" fill="#2b3a48">getReports → agrupa por día comercial y moneda</text><text x="612" y="541" font-size="11.3" fill="#2b3a48">Errores con statusCode: 400 / 404 / 409 / 500</text><line x1="860" y1="564" x2="860" y2="596" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><text x="872" y="586" font-size="11" fill="#34506b" text-anchor="start">registerMovementAudit</text><rect x="600" y="596" width="260" height="50" rx="8" fill="#eaf0f6" stroke="#34506b" stroke-width="1.5"/><text x="612" y="617" font-size="13" font-weight="700" fill="#1b2733">banksAuditService.js</text><text x="612" y="637" font-size="11" fill="#2b3a48">una fila de auditoría por detalle</text><line x1="300" y1="564" x2="300" y2="672" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><line x1="1000" y1="564" x2="1000" y2="672" stroke="#34506b" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="672" width="640" height="96" rx="8" fill="#e9f3ec" stroke="#2f6b46" stroke-width="1.5"/><text x="52" y="693" font-size="13" font-weight="700" fill="#1b2733">Datos — esquema &quot;Treasury&quot; (migraciones 0032–0039)</text><text x="52" y="713" font-size="11.3" fill="#2b3a48">bank_institutions → banks → bank_accounts → bank_transactions → bank_transaction_details</text><text x="52" y="729" font-size="11.3" fill="#2b3a48">bank_audit (append-only) · vista bank_account_balances (saldo calculado, sin trigger)</text><text x="52" y="745" font-size="11.3" fill="#2b3a48">Movimientos, detalles y auditoría: UPDATE/DELETE prohibidos por la base</text><rect x="720" y="672" width="440" height="96" rx="8" fill="#f6efe2" stroke="#9a6a1c" stroke-width="1.5"/><text x="732" y="693" font-size="13" font-weight="700" fill="#1b2733">Lecturas en otros esquemas</text><text x="732" y="713" font-size="11.3" fill="#2b3a48">&quot;Ecosystem&quot;.documents (el documento de origen existe)</text><text x="732" y="729" font-size="11.3" fill="#2b3a48">&quot;Ecosystem&quot;.contable_accounts (cuenta contable de la empresa)</text><text x="732" y="745" font-size="11.3" fill="#2b3a48">&quot;Ecosystem&quot;.company_settings.time_zone (día comercial)</text><rect x="40" y="790" width="1120" height="38" rx="8" fill="#ffffff" stroke="#d3d9de" stroke-width="1.5"/><text x="52" y="811" font-size="13" font-weight="700" fill="#1b2733"></text><text x="54" y="814" font-size="11" fill="#2b3a48" text-anchor="start">Leyenda: azul = código existente verificado en work.Juan · verde = datos (verificados en la BD viva) · ámbar = tablas de otros módulos · gris discontinuo = consumidor aún no verificado</text>
</svg>
